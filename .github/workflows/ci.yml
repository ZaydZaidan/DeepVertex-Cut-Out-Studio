name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the light dependency set is needed: the test suite uses a fake
      # engine, and cutout.engine imports torch lazily.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy Pillow pymatting pytest ruff trimesh
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  build-package:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel installs its console scripts
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl --no-deps
          # the import check needs the light runtime deps (lazy torch is fine)
          /tmp/verify/bin/pip install numpy Pillow scipy pymatting
          /tmp/verify/bin/python -c "import cutout, cutout.cli, cutout.compose, cutout.refine, cutout.pipeline; print('import ok', cutout.__version__)"
