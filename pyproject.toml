[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepvertex-cutout-studio"
version = "1.1.0"
description = "Local, GPU-accelerated AI background remover + 3D product-snapshot renderer — clean-room reconstruction of the remove.bg workflow (BiRefNet / RMBG-2.0); STEP/STL models to web-ready studio shots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zayd Zaidan", email = "zaydzihnizaidan@gmail.com" }]
keywords = [
  "background-removal", "image-mattening", "cutout", "birefnet", "rmbg",
  "pytorch", "pyside6", "cuda", "computer-vision",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "Pillow>=10.0",
  "pymatting>=1.1.12",
  "transformers>=4.39",
  "huggingface_hub>=0.23",
  "timm>=1.0",
  "einops>=0.8",
  "kornia>=0.7",
  "PySide6>=6.6",
  "torch>=2.4",
  "torchvision>=0.19",
  # 3D product snapshots
  "trimesh>=4.0",
  "moderngl>=5.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
render = ["cairosvg>=2.7"]
step = ["cadquery>=2.4"]

[project.urls]
Homepage = "https://github.com/ZaydZaidan/DeepVertex-Cut-Out-Studio"
Repository = "https://github.com/ZaydZaidan/DeepVertex-Cut-Out-Studio"
Issues = "https://github.com/ZaydZaidan/DeepVertex-Cut-Out-Studio/issues"
Changelog = "https://github.com/ZaydZaidan/DeepVertex-Cut-Out-Studio/blob/main/CHANGELOG.md"

[project.scripts]
cutout-studio = "cutout.gui:main"
cutout = "cutout.cli:main"
cutout-mesh = "cutout.meshcli:main"

[tool.setuptools]
packages = ["cutout"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
